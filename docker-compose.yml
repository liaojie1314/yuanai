version: '3.9'

services:
  postgres:
    image: postgres:16.14-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    environment:
      POSTGRES_DB: yuanai
      POSTGRES_USER: yuanai
      POSTGRES_PASSWORD: password
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  searxng:
    image: ghcr.io/searxng/searxng:2026.8.14-094c33d40@sha256:892cf809341915a4b7710d3c9045005b4c377d51335a089b6d4da0b28750788d
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?run pnpm setup:search first}
      # 代理仅由开发者显式配置；默认直接联网，不能假设终端用户拥有 7890 等本地端口。
      HTTP_PROXY: ${SEARXNG_PROXY_URL:-}
      HTTPS_PROXY: ${SEARXNG_PROXY_URL:-}
      NO_PROXY: localhost,127.0.0.1,searxng,postgres,redis,minio
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - '127.0.0.1:8082:8080'
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
