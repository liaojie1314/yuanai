name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已有的版本 tag，例如 v1.0.0'
        required: true
        type: string
      ref:
        description: '构建代码的分支或 commit；留空时使用 tag'
        required: false
        type: string
      only:
        description: '失败后只补跑一个构建 job'
        required: false
        default: all
        type: choice
        options: [all, web, desktop]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.21.1
  PNPM_VERSION: 10.22.0

jobs:
  prepare:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Extract release description from changelog
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          version = os.environ["RELEASE_TAG"].lstrip("v")
          source = open("CHANGELOG.md", encoding="utf-8").read()
          heading = re.compile(r"^#{1,3}\s+\[?" + re.escape(version) + r"\]?(?:\s|\(|$)", re.M)
          match = heading.search(source)
          if not match:
              raise SystemExit(f"::error::CHANGELOG.md 中未找到 {version} 小节")

          next_heading = re.compile(r"^#{1,3}\s+\[?\d+\.\d+\.\d+\]?(?:\s|\(|$)", re.M)
          next_match = next_heading.search(source, match.end())
          section = source[match.start() : next_match.start() if next_match else len(source)]
          body = "\n".join(section.strip().splitlines()[1:]).strip()
          if not body:
              raise SystemExit(f"::error::CHANGELOG.md 中的 {version} 小节为空")
          open("release-body.md", "w", encoding="utf-8").write(body + "\n")
          print(body[:1200])
          PY
          test -s release-body.md
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          RELEASE_REF=$(git rev-parse HEAD)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')
            RELEASE_NOTES=$(cat release-body.md)
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -f "name=$RELEASE_TAG" -f "body=$RELEASE_NOTES" >/dev/null
          else
            gh release create "$RELEASE_TAG" --target "$RELEASE_REF" --title "$RELEASE_TAG" --notes-file release-body.md
          fi

  web:
    name: Build Web
    needs: prepare
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'web'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref_name }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Web
        run: pnpm --filter @yuanai/web build
      - name: Archive Web build
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: tar -czf "yuanai-web-${RELEASE_TAG}.tar.gz" -C apps/web .next package.json
      - name: Upload Web artifact to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(yuanai-web-*.tar.gz)
          ((${#files[@]} > 0)) || { echo "No Web release archive found" >&2; exit 1; }
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber

  desktop:
    name: Build Desktop (${{ matrix.target }})
    needs: prepare
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'desktop'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-22.04
          - target: win
            os: windows-2022
          - target: mac
            os: macos-14
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref_name }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Package Electron app without signing
        if: matrix.target != 'win'
        run: pnpm --filter @yuanai/desktop package:${{ matrix.target }}
      - name: Package Electron app with Windows signing
        if: matrix.target == 'win'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: pnpm --filter @yuanai/desktop package:${{ matrix.target }}
      - name: Upload Linux artifacts to GitHub Release
        if: matrix.target == 'linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.rpm
            apps/desktop/dist/latest-linux.yml
          )
          ((${#files[@]} == 4)) || { echo "Linux release artifacts are incomplete" >&2; exit 1; }
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
      - name: Upload Windows artifacts to GitHub Release
        if: matrix.target == 'win'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.exe.blockmap
            apps/desktop/dist/latest.yml
          )
          ((${#files[@]} >= 4)) || { echo "Windows release artifacts are incomplete" >&2; exit 1; }
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
      - name: Upload macOS artifacts to GitHub Release
        if: matrix.target == 'mac'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.zip.blockmap
            apps/desktop/dist/latest-mac.yml
          )
          ((${#files[@]} == 4)) || { echo "macOS release artifacts are incomplete" >&2; exit 1; }
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
