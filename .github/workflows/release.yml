name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已有的版本 tag，例如 v1.0.0'
        required: true
        type: string
      ref:
        description: '构建代码的分支或 commit；留空时使用 tag'
        required: false
        type: string
      only:
        description: '失败后只补跑一个构建 job'
        required: false
        default: all
        type: choice
        options: [all, web, desktop]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.21.1
  PNPM_VERSION: 10.22.0

jobs:
  prepare:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Generate release notes from commits
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -Fxv "$RELEASE_TAG" | head -n 1 || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            git log --no-merges --pretty=format:'- %s (%h)' "$PREVIOUS_TAG"..HEAD > release-notes.md
          else
            git log --no-merges --pretty=format:'- %s (%h)' -n 100 HEAD > release-notes.md
          fi
          test -s release-notes.md
          printf 'Release %s\n\n' "$RELEASE_TAG" | cat - release-notes.md > release-notes.tmp
          mv release-notes.tmp release-notes.md
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_REF: ${{ inputs.ref || inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')
            RELEASE_NOTES=$(cat release-notes.md)
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -f "name=$RELEASE_TAG" -f "body=$RELEASE_NOTES" >/dev/null
          else
            gh release create "$RELEASE_TAG" --target "$RELEASE_REF" --title "$RELEASE_TAG" --notes-file release-notes.md
          fi

  web:
    name: Build Web
    needs: prepare
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'web'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref_name }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Web
        run: pnpm --filter @yuanai/web build
      - name: Archive Web build
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: tar -czf "yuanai-web-${RELEASE_TAG}.tar.gz" -C apps/web .next package.json
      - name: Upload Web artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: yuanai-web-*.tar.gz
          fail_on_unmatched_files: true
          overwrite_files: true
          token: ${{ github.token }}

  desktop:
    name: Build Desktop (${{ matrix.target }})
    needs: prepare
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'desktop'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-22.04
          - target: win
            os: windows-2022
          - target: mac
            os: macos-14
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref_name }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Package Electron app without signing
        if: matrix.target != 'win'
        run: pnpm --filter @yuanai/desktop package:${{ matrix.target }}
      - name: Package Electron app with Windows signing
        if: matrix.target == 'win'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: pnpm --filter @yuanai/desktop package:${{ matrix.target }}
      - name: Upload Linux artifacts to GitHub Release
        if: matrix.target == 'linux'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.rpm
          fail_on_unmatched_files: true
          overwrite_files: true
          token: ${{ github.token }}
      - name: Upload Windows artifacts to GitHub Release
        if: matrix.target == 'win'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: apps/desktop/dist/*.exe
          fail_on_unmatched_files: true
          overwrite_files: true
          token: ${{ github.token }}
      - name: Upload macOS artifacts to GitHub Release
        if: matrix.target == 'mac'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
          fail_on_unmatched_files: true
          overwrite_files: true
          token: ${{ github.token }}
